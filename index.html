<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="board" id="board">

    <div class="banner" aria-hidden="false">
      <span class="banner-strip strip-a"></span>
      <h1 class="banner-title">Happy Birthday<span class="banner-name" id="banner-name"></span></h1>
      <span class="banner-strip strip-b"></span>
    </div>

    <div class="canvas" id="canvas">
      <div class="note-glow" aria-hidden="true"></div>
      <svg class="strings" id="strings" preserveAspectRatio="none"></svg>

      <div class="note" id="note">
        <div class="note-pin"></div>
        <p class="note-message" id="note-message"></p>
        <p class="note-from" id="note-from"></p>
      </div>

      <div class="photos" id="photos"></div>
    </div>

  </div>

  <footer class="credit">made with love · scroll to see everything</footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
